<!DOCTYPE html>
<html>
<head>
  <title>Web App Wisata</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:linear-gradient(to right,#fff,#ffd6e7);
      padding:30px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      color:#ff4f8b;
    }

    .container{
      display:grid;
      grid-template-columns:350px 1fr;
      gap:30px;
    }

    .form-box{

      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);

      position:sticky;
      top:20px;
      height:fit-content;
    }

    .form-box h2{
      margin-bottom:20px;
      color:#ff4f8b;
    }

    input, textarea{

      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
    }

    button{

      width:100%;
      padding:14px;
      border:none;
      background:#ff4f8b;
      color:white;
      border-radius:10px;
      margin-top:20px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#ff2f74;
    }

    .data-box{

      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .card{

      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);

      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{

      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:15px;
    }

    .kategori{

      color:#ff4f8b;
      font-weight:bold;
      margin:8px 0;
    }

    .harga{

      margin-top:10px;
      font-weight:bold;
    }

    @media(max-width:900px){

      .container{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

<h1> Web App Data Wisata </h1>

<div class="container">

  <!-- FORM INPUT -->

  <div class="form-box">

    <h2>Input Wisata</h2>

    <input type="text" id="id" placeholder="ID">
    <input type="text" id="nama" placeholder="Nama Wisata">
    <input type="text" id="kategori" placeholder="Kategori">
    <input type="text" id="lokasi" placeholder="Lokasi Kota">
    <input type="text" id="harga" placeholder="Harga Tiket">
    <textarea id="deskripsi" placeholder="Deskripsi"></textarea>

    <input type="text" id="gambar" placeholder="Link Gambar Drive">

    <button onclick="simpanData()">
      Simpan Data
    </button>

  </div>

  <!-- TAMPIL DATA -->

  <div class="data-box" id="dataWisata">

  </div>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbww_qyVxwBi_cZ_WGX4_bd7xnjzq-vkckI7ZIIUHY9xgWLG-vOmq-kW5dwdnQFiBin2UA/exec";


// =======================
// LOAD DATA
// =======================

function loadData(){

  fetch(WEB_APP_URL)

  .then(response => response.json())

  .then(data => {

    let output = "";

    data.reverse().forEach(item => {

      output += `

      <div class="card">

        <img src="${item.gambar}" alt="gambar wisata">

        <div class="card-content">

          <h2>${item.nama_wisata}</h2>

          <p class="kategori">${item.kategori}</p>

          <p>${item.deskripsi}</p>

          <p>${item.lokasi_kota}</p>

          <p class="harga">
            Harga Tiket : Rp ${item.harga_tiket}
          </p>

        </div>

      </div>

      `;

    });

    document.getElementById("dataWisata").innerHTML = output;

  })

  .catch(error => {

    console.log(error);

    alert("Gagal mengambil data");

  });

}


// =======================
// SIMPAN DATA
// =======================

function simpanData(){

  const data = {

    id: document.getElementById("id").value,
    nama_wisata: document.getElementById("nama").value,
    kategori: document.getElementById("kategori").value,
    lokasi_kota: document.getElementById("lokasi").value,
    harga_tiket: document.getElementById("harga").value,
    deskripsi: document.getElementById("deskripsi").value,
    gambar: document.getElementById("gambar").value

  };

  fetch(WEB_APP_URL, {

    method: "POST",

    headers: {
      "Content-Type": "text/plain;charset=utf-8",
    },

    body: JSON.stringify(data)

  })

  .then(response => response.text())

  .then(result => {

    alert("Data berhasil disimpan!");

    // reset form
    document.getElementById("id").value = "";
    document.getElementById("nama").value = "";
    document.getElementById("kategori").value = "";
    document.getElementById("lokasi").value = "";
    document.getElementById("harga").value = "";
    document.getElementById("deskripsi").value = "";
    document.getElementById("gambar").value = "";

    // reload data
    loadData();

  })

  .catch(error => {

    console.log(error);

    alert("Gagal menyimpan data");

  });

}


// pertama kali load
loadData();

</script>

</body>
</html>
