<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Web App Data Wisata</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(to right,#fff,#ffd6e7);
      padding:30px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      color:#ff4f8b;
    }

    .container{
      display:grid;
      grid-template-columns:380px 1fr;
      gap:30px;
      align-items:start;
    }

    .box{
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .box h2{
      color:#ff4f8b;
      margin-bottom:20px;
    }

    input, textarea, select{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:15px;
    }

    textarea{
      resize:none;
      min-height:100px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      background:#ff4f8b;
      color:white;
      border-radius:10px;
      margin-top:20px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#ff2f74;
    }

    .data-box{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .card{
      background:#fff;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      height:200px;
      object-fit:cover;
    }

    .card-content{
      padding:15px;
    }

    .kategori{
      color:#ff4f8b;
      font-weight:bold;
      margin:8px 0;
    }

    .harga{
      margin-top:10px;
      font-weight:bold;
    }

    #preview{
      width:100%;
      margin-top:10px;
      border-radius:10px;
      display:none;
    }

    @media(max-width:900px){
      .container{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<h1>Web App Data Wisata</h1>

<div class="container">

  <!-- FORM -->
  <div class="box">
    <h2>Form Wisata</h2>

    <input type="text" id="id" placeholder="ID Wisata">

    <input type="text" id="nama" placeholder="Nama Wisata">

    <select id="kategori">
      <option value="">Pilih Kategori</option>
      <option>Pantai</option>
      <option>Gunung</option>
      <option>Air Terjun</option>
      <option>Taman Wisata</option>
    </select>

    <input type="text" id="lokasi" placeholder="Lokasi">

    <input type="number" id="harga" placeholder="Harga Tiket">

    <textarea id="deskripsi" placeholder="Deskripsi"></textarea>

    <input type="file" id="gambarFile" accept="image/*">

    <img id="preview">

    <button onclick="simpanData()">
      Simpan Data
    </button>
  </div>

  <!-- DATA -->
  <div class="box">
    <h2>Data Wisata</h2>

    <div class="data-box" id="dataWisata"></div>
  </div>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbww_qyVxwBi_cZ_WGX4_bd7xnjzq-vkckI7ZIIUHY9xgWLG-vOmq-kW5dwdnQFiBin2UA/exec";

let gambarBase64 = "";


// PREVIEW GAMBAR

document.getElementById("gambarFile")
.addEventListener("change", function(e){

  const file = e.target.files[0];

  const reader = new FileReader();

  reader.onload = function(event){

    gambarBase64 = event.target.result;

    document.getElementById("preview").src = gambarBase64;

    document.getElementById("preview").style.display = "block";
  };

  if(file){
    reader.readAsDataURL(file);
  }

});


// LOAD DATA

function loadData(){

  fetch(WEB_APP_URL)

  .then(res => res.json())

  .then(data => {

    let output = "";

    data.reverse().forEach(item => {

      output += `

        <div class="card">

          <img src="${item.gambar}" alt="gambar wisata">

          <div class="card-content">

            <h3>${item.nama_wisata}</h3>

            <p class="kategori">${item.kategori}</p>

            <p>${item.deskripsi}</p>

            <p>${item.lokasi_kota}</p>

            <p class="harga">
              Rp ${item.harga_tiket}
            </p>

          </div>

        </div>

      `;

    });

    document.getElementById("dataWisata").innerHTML = output;

  })

  .catch(error => {

    console.log(error);

    alert("Gagal mengambil data");

  });

}


// SIMPAN DATA

function simpanData(){

  const data = {

    id: document.getElementById("id").value,

    nama_wisata: document.getElementById("nama").value,

    kategori: document.getElementById("kategori").value,

    lokasi_kota: document.getElementById("lokasi").value,

    harga_tiket: document.getElementById("harga").value,

    deskripsi: document.getElementById("deskripsi").value,

    gambar: gambarBase64

  };

  fetch(WEB_APP_URL,{

    method:"POST",

    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },

    body: JSON.stringify(data)

  })

  .then(res => res.text())

  .then(() => {

    alert("Data berhasil disimpan");

    // RESET FORM

    document.getElementById("id").value = "";

    document.getElementById("nama").value = "";

    document.getElementById("kategori").value = "";

    document.getElementById("lokasi").value = "";

    document.getElementById("harga").value = "";

    document.getElementById("deskripsi").value = "";

    document.getElementById("gambarFile").value = "";

    document.getElementById("preview").style.display = "none";

    gambarBase64 = "";

    // RELOAD DATA

    loadData();

  })

  .catch(error => {

    console.log(error);

    alert("Gagal menyimpan data");

  });

}


// PERTAMA KALI LOAD

loadData();

</script>

</body>
</html>
